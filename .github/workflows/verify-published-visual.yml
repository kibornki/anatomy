name: Verify published visual quality
on:
  push:
    branches: [gh-pages]
    paths:
      - 'index.html'
      - 'upperbody.html'
      - 'arm.html'
      - 'abdomen.html'
      - 'forearm.html'
      - 'thigh.html'
      - 'work/visual/review-published.py'
      - '.github/workflows/verify-published-visual.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install real browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify deployed documents and all five browser tabs
        env:
          ANATOMY_EXPECTED_REVISION: ${{ github.sha }}
        run: python work/visual/review-published.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anatomy-published-visual
          path: artifacts/published-visual
          retention-days: 14
