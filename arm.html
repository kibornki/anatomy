:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );

    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

.cursor-interaction {
  cursor: var(--cursor-interaction, pointer);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget > :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {

}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);

  cursor: var(--cursor-interaction, pointer);

}

.btn:is(.btn-block, .viz-tile) {

}

}

a.btn {
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled="true"]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

  color: var(--muted-foreground);
  background: transparent;

.btn-ghost:not(:disabled):hover {

.nav-pills .nav-link {

.nav-justified .nav-link {

.viz-dotted-background {
  background-image: radial-gradient(

    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(> .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));

.viz-carousel > [data-variant][hidden] {

.viz-carousel > [data-variant] {

.viz-carousel-controls {

.viz-carousel-controls button,
.viz-carousel-picker > summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;

  background: transparent !important;

.viz-carousel-controls > button,
.viz-carousel-picker > summary {

}

.viz-carousel-controls > button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker > summary {

}

  flex: none;
  margin: 0;

  transform: rotate(180deg);
}

.viz-carousel-controls > button > svg,
.viz-carousel-controls .viz-carousel-caret,

}

.viz-carousel-controls > button::before,
.viz-carousel-picker > summary::before {

  const transparent=root.classList.contains('transparent'),fibersOn=!root.classList.contains('no-fibers'),key=[angle,view,transparent,fibersOn].join();if(key===lastKey)return;lastKey=key;
  const start=performance.now(),degrees=view==='side'?90:view==='back'?164:16,a=degrees*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
  const project=p=>[offsets.get(view)+(p[0]*c+p[2]*s)*1.05,15+(p[1]-29)*1.05],depth=p=>-p[0]*s+p[2]*c;
  const posed=nodes.map(n=>n.part.v.map(p=>skin(p,n.part,angle))),buffer=AbdominalVisibility({project,depth,step:.9});
  nodes.forEach((n,i)=>n.part.f.forEach(f=>buffer.triangle(...f.map(j=>posed[i][j]),i)));
  const visible=buffer.solve(nodes.length,{projections:i=>nodes[i].part.kind!=='bone',scanlineClips:false,occludes:i=>!transparent||nodes[i].part.kind==='bone'});
  nodes.forEach((n,i)=>{
   const soft=n.part.kind!=='bone',local=visible.ownerZ[i],inside=k=>transparent&&soft?local[k]>-Infinity:visible.owners[k]===i;
   const contour=AtlasContour(visible,inside,visible.bounds[i]);n.fill.setAttribute('d',contour);n.outline.setAttribute('d',contour);n.mask.setAttribute('d',contour);n.g.setAttribute('opacity',transparent&&soft?.32:1);
   let path='';if(fibersOn)for(const fiber of n.part.fibers){let segment=[];const flush=()=>{path+=curve(segment);segment=[];};for(const p of fiber){const point=skin(p,n.part,angle),q=project(point),x=Math.floor((q[0]-visible.x0)/visible.step),y=Math.floor((q[1]-visible.y0)/visible.step),k=y*visible.w+x;
     if(x>=0&&x<visible.w&&y>=0&&y<visible.h&&depth(point)>=local[k]-2.5&&(transparent||visible.owners[k]===i))segment.push(q);else flush();}flush();}
   n.fiber.setAttribute('d',path);n.fiber.setAttribute('stroke-opacity',n.part.kind==='tendon'?.18:.28);
  });
  labelNodes.forEach(n=>n.g.style.display='none');
  for(const [name,text,x,y]of specs[view]){
   const id=nodes.findIndex(n=>n.part.name===name);let points=visible.centers[id];if(transparent){points=[];const b=visible.bounds[id],local=visible.ownerZ[id];for(let iy=b[1];iy<=b[3];iy+=6)for(let ix=b[0];ix<=b[2];ix+=6)if(local[iy*visible.w+ix]>-Infinity)points.push([visible.x0+(ix+.5)*visible.step,visible.y0+(iy+.5)*visible.step]);}
   if(points.length<3||!transparent&&visible.coverage[id]<80)continue;const avg=points.reduce((sum,p)=>sum.map((v,j)=>v+p[j]/points.length),[0,0]),target=points.reduce((best,p)=>Math.hypot(...p.map((v,j)=>v-avg[j]))<Math.hypot(...best.map((v,j)=>v-avg[j]))?p:best);
   const n=labelNodes.get(name);n.g.style.display='';n.text.textContent=text;n.text.setAttribute('x',x);n.text.setAttribute('y',y);n.text.setAttribute('text-anchor',x<320?'start':'end');n.line.setAttribute('d',`M${x},${y+5}L${target.join(',')}`);
  }
  svg.setAttribute('viewBox','0 0 640 640');svg.setAttribute('height',root.clientWidth);root.dataset.cameraYaw=degrees;
  debug={angle,view,posed:posed.map((v,i)=>({name:nodes[i].part.name,kind:nodes[i].part.kind,forearm:!!nodes[i].part.forearm,v})),coverage:visible.coverage,duration:performance.now()-start};
 }
 return {render,atlas,skin,forearm,get debug(){return debug;}};
}

(()=>{
 const root=document.getElementById('arm'),model=AtlasArm(root),by=id=>document.getElementById('arm-'+id),cfg=document.getElementById('hub-config'),config=cfg?JSON.parse(cfg.textContent):null,store='artist-arm-v1',topic='팔 팔꿈치 굽힘';
 let angle=0,view='front',playing=false,phase=0,last=0,lastDraw=0;
 let saved=config?.state;try{saved??=JSON.parse(localStorage.getItem(store)||'null');}catch{}
 const content=saved?.modelContent;if(content?.topic===topic){if(Number.isFinite(content.angle))angle=Math.max(0,Math.min(135,content.angle));if(['front','side','back'].includes(content.camera))view=content.camera;if(typeof content.fibers==='boolean')by('fibers').checked=content.fibers;if(typeof content.transparent==='boolean')by('transparent').checked=content.transparent;playing=saved.privateContent?.playing===true&&!matchMedia('(prefers-reduced-motion: reduce)').matches;}
 if(['front','side','back'].includes(location.hash.slice(1)))view=location.hash.slice(1);
 const legendItems={front:[['red','이두 장두'],['blue','이두 단두'],['orange','삼각근']],back:[['red','삼두 장두'],['blue','외측두'],['green','내측두'],['orange','삼각근']],side:[['red','이두·삼두 장두'],['blue','이두 단두·삼두 외측두'],['green','삼두 내측두'],['orange','삼각근']]};
 let lastView='';function render(){root.classList.toggle('no-fibers',!by('fibers').checked);root.classList.toggle('transparent',by('transparent').checked);root.dataset.angle=angle;root.dataset.camera=view;root.dataset.revision='arm-atlas-aponeurosis-v1';model.render(angle,view);by('angle').value=angle;by('value').textContent=Math.round(angle)+'°';by('angle').setAttribute('aria-valuetext',Math.round(angle)+'도 굽힘');for(const v of ['front','side','back'])by(v).setAttribute('aria-pressed',v===view);root.querySelector('.diagram-caption').textContent=(view==='side'?'측면':view==='front'?'정면 사선':'후면 사선')+' · 오른팔 · 이두·삼두·삼각근';
  if(lastView!==view){lastView=view;const legend=root.querySelector('.diagram-legend');legend.replaceChildren();for(const [color,name]of legendItems[view]){const span=document.createElement('span'),key=document.createElement('i');key.className=color+'-key';span.append(key,document.createTextNode(name));legend.append(span);}}
 }
 function capture(){const state={modelContent:{revision:'arm-atlas-aponeurosis-v1',topic,angle:Math.round(angle),camera:view,fibers:by('fibers').checked,transparent:by('transparent').checked},privateContent:{playing}};try{localStorage.setItem(store,JSON.stringify(state));}catch{}if(config)parent.postMessage({type:'anatomy-hub-state',key:config.key,state},'*');}
 function play(on){playing=on;by('play').textContent=on?'일시정지':'재생';by('play').setAttribute('aria-pressed',on);last=0;}
 function syncPhase(){phase=Math.acos(Math.max(-1,Math.min(1,1-2*angle/135)));}
 by('angle').addEventListener('input',()=>{play(false);angle=+by('angle').value;render();capture();});
 by('play').addEventListener('click',()=>{if(!playing)syncPhase();play(!playing);capture();});
 for(const v of ['front','side','back'])by(v).addEventListener('click',()=>{view=v;render();capture();queueFit();});
 for(const id of ['fibers','transparent'])by(id).addEventListener('change',()=>{render();capture();});
 let pending=false;function fit(){pending=false;const svg=root.querySelector('svg'),available=Math.max(0,document.documentElement.clientWidth-32),overhead=root.scrollHeight-svg.getBoundingClientRect().height,width=Math.floor(available<=680?available:Math.min(available,700,Math.max(220,innerHeight-overhead-48)))+'px';if(root.style.width!==width)root.style.width=width;}
 function queueFit(){if(!pending){pending=true;requestAnimationFrame(fit);}}window.addEventListener('resize',queueFit);new ResizeObserver(queueFit).observe(root);new ResizeObserver(render).observe(root);
 let lastCapture=0;function tick(t){if(playing&&t-lastDraw>=50){if(last)phase+=Math.min(t-last,120)*Math.PI/5500;angle=135*(1-Math.cos(phase))/2;render();last=t;lastDraw=t;if(t-lastCapture>=500){capture();lastCapture=t;}}requestAnimationFrame(tick);}requestAnimationFrame(tick);
 window.armAtlas={model,root,setPose(a,v=view){play(false);angle=Math.max(0,Math.min(135,a));if(['front','side','back'].includes(v))view=v;render();capture();}};
 syncPhase();play(playing);render();queueFit();capture();
})();
</script></body></html>
