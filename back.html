:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

.cursor-interaction {
  cursor: var(--cursor-interaction, pointer);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: var(--cursor-interaction, pointer);
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget > :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled="true"]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(> .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel > [data-variant][hidden] {
  display: none !important;

.viz-carousel > [data-variant] {

}

.viz-carousel-controls {

  width: max-content;

  gap: 0;

  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);

  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

/* Keep authored mockup button styles out of the shared carousel chrome. */
.viz-carousel-controls button,
.viz-carousel-picker > summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;
  color: inherit !important;
  background: transparent !important;
  font: inherit !important;
  -webkit-tap-highlight-color: transparent;

.viz-carousel-controls > button,
.viz-carousel-picker > summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls > button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker > summary {
  padding-inline: 12px !important;
}

.viz-carousel-controls .viz-carousel-caret {
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  color: inherit;
  transform: rotate(180deg);
}

.viz-carousel-controls > button > svg,
.viz-carousel-controls .viz-carousel-caret,
.viz-carousel-count {
  opacity: 0.5;
}

.viz-carousel-controls > button::before,
.viz-carousel-picker > summary::before {

  z-index: -1;
  inset: 3px;
  border-radius: 12px;
  content: "";
  pointer-events: none;
}

.viz-carousel-controls > button:hover::before,
.viz-carousel-picker > summary:hover::before {

.viz-carousel-controls > button,

.viz-carousel-options > [aria-current="true"],

    const infraTendon=path('','posterior-tendon',deepLayer),minorTendon=path('','posterior-tendon',deepLayer);
    infra.shape.setAttribute('data-tooltip','극하근 · 견갑골 극하와 → 상완골 대결절 중부');
    minor.shape.setAttribute('data-tooltip','소원근 · 견갑골 외측연 상부 → 상완골 대결절 하부');
    const lat=createRegion('lat',0,32),teres=createRegion('teres',4,16),lower=createRegion('lower',1,19),middle=createRegion('middle',2,15),upper=createRegion('upper',3,20);
    teres.shape.setAttribute('data-tooltip','대원근 · 견갑골 하각 후면 → 상완골 결절간구 내측순');
    const tendon=path('','hidden-tendon',group),attach=el('circle',{r:4,class:'attachment'},group);
    const teresTendon=path('','hidden-tendon',group),teresAttach=el('circle',{r:3.5,class:'attachment'},group);
    const rotation=path('','rotation',group);

  });
  const label=text=>{const g=el('g',{},labels),line=path('','',g),t=el('text',{'text-anchor':'middle'},g);t.textContent=text;return {g,line,t};};
  const scapLabel=label('견갑골 하각'),fasciaLabel=label('흉요근막'),insertionLabel=label('광배근 전방 정지부');
  const upperLabel=label('승모근 상부'),middleLabel=label('승모근 중부'),lowerLabel=label('승모근 하부'),latLabel=label('광배근');
  const teresLabel=label('대원근');
  const infraLabel=label('극하근'),minorLabel=label('소원근');
  function pose(){
    // Do not directly apply a literature 3D upward-rotation angle to a flat posterior drawing.
    // A moderated in-plane projection keeps the inferior border near the thoracic envelope.
    // This schematic projection is illustrative rather than a fitted patient-specific angle.
    const radians=angle*Math.PI/180,up=Math.max(0,(angle-25)/125)*32;

  function fibers(region,origins,ends,bow=0){

      const t=(i+1)/(region.lines.length+1),o=origins(t),end=ends(t),c=mix(o,end,.5);c[1]+=bow;
      p.setAttribute('d',`M ${xy(o)} Q ${xy(c)} ${xy(end)}`);

  }
  function latissimusContour(foldLow,S,lift){

    for(const p of lowerBorder){

  function draw(){
    const {up,lift,S,H,at}=pose();

    const lowerRoot=S([76,188]),upperMed=[4,166],middleMed=[4,226];

    // Its anterior humeral insertion is represented separately by a dashed projection.

    // https://rad.uw.edu/muscle-atlas/teres-minor

    const infraMedialUpper=S([68,190]),infraMedialLower=S([83,277]);
    const infraTop=S([145,184]),infraLateralLower=S([124,246]);
    const infraEndUpper=at(7,10),infraEndLower=at(19,10);
    const infraInsertUpper=at(7,16),infraInsertLower=at(19,16);
    const minorOriginUpper=S([141,220]),minorOriginLower=S([126,245]);
    const minorEndUpper=at(22,10),minorEndLower=at(32,10);
    const minorInsertUpper=at(22,15),minorInsertLower=at(32,15);

    // Source: https://rad.uw.edu/muscle-atlas/teres-major (original 2D projection).

    const teresOriginMid=mix(teresUpper,teresLower,.5),teresEndMid=mix(teresEndUpper,teresEndLower,.5);
    const teresDx=teresEndMid[0]-teresOriginMid[0],teresDy=teresEndMid[1]-teresOriginMid[1];
    const teresLength=Math.hypot(teresDx,teresDy),teresNormal=[-teresDy/teresLength,teresDx/teresLength];
    const teresTopControl=add(mix(teresUpper,teresEndUpper,.5),teresNormal.map(n=>-14*n));
    const teresLowControl=add(mix(teresLower,teresEndLower,.5),teresNormal.map(n=>14*n));
    for(const s of sides){
      s.scap.setAttribute('transform',`translate(${f(7*lift)} ${f(-8*lift)}) rotate(${-up} 112 190)`);
      s.arm.setAttribute('transform',`translate(${xy(H)}) rotate(${-angle})`);
      s.infra.shape.setAttribute('d',`M ${xy(infraMedialUpper)} Q ${xy(S([109,185]))} ${xy(infraTop)} Q ${xy(mix(infraTop,infraEndUpper,.5))} ${xy(infraEndUpper)} L ${xy(infraEndLower)} Q ${xy(S([147,210]))} ${xy(infraLateralLower)} L ${xy(S([101,279]))} Q ${xy(S([87,289]))} ${xy(infraMedialLower)} Q ${xy(S([65,241]))} ${xy(infraMedialUpper)} Z`);
      fibers(s.infra,t=>S([68+15*t*t,194+81*t]),t=>mix(infraEndUpper,infraEndLower,t),3);
      s.infraTendon.setAttribute('d',`M ${xy(infraEndUpper)} L ${xy(infraInsertUpper)} L ${xy(infraInsertLower)} L ${xy(infraEndLower)} Z`);
      s.minor.shape.setAttribute('d',`M ${xy(minorOriginUpper)} Q ${xy(add(mix(minorOriginUpper,minorEndUpper,.5),[0,-3]))} ${xy(minorEndUpper)} L ${xy(minorEndLower)} Q ${xy(add(mix(minorOriginLower,minorEndLower,.5),[0,4]))} ${xy(minorOriginLower)} Z`);
      fibers(s.minor,t=>mix(minorOriginUpper,minorOriginLower,t),t=>mix(minorEndUpper,minorEndLower,t),1);
      s.minorTendon.setAttribute('d',`M ${xy(minorEndUpper)} L ${xy(minorInsertUpper)} L ${xy(minorInsertLower)} L ${xy(minorEndLower)} Z`);
      s.clav.setAttribute('d',`M 17,148 Q 88,${f(acromion[1]-13)} ${xy(acromion)} L ${xy(add(acromion,[0,7]))} Q 88,${f(acromion[1]-4)} 17,156 Z`);
      const latStart=[6,273];
      s.lat.shape.setAttribute('d',`M ${xy(latStart)} Q 82,292 ${xy(fold)} L ${xy(foldLow)} Q ${xy(latContour.control)} ${xy(latContour.end)} Q 107,402 104,437 Q 75,459 26,451 L 6,387 Z`);
      s.teres.shape.setAttribute('d',`M ${xy(teresUpper)} Q ${xy(teresTopControl)} ${xy(teresEndUpper)} L ${xy(teresEndLower)} Q ${xy(teresLowControl)} ${xy(teresLower)} Q ${xy(S([101,275]))} ${xy(teresUpper)} Z`);
      s.teres.lines.forEach((p,i)=>{
        const t=(i+1)/(s.teres.lines.length+1);
        p.setAttribute('d',`M ${xy(mix(teresUpper,teresLower,t))} Q ${xy(mix(teresTopControl,teresLowControl,t))} ${xy(mix(teresEndUpper,teresEndLower,t))}`);
      });
      s.teresTendon.setAttribute('d',`M ${xy(mix(teresEndUpper,teresEndLower,.5))} Q ${xy(at(46,-15))} ${xy(teresInsert)}`);
      s.teresAttach.setAttribute('cx',teresInsert[0]);s.teresAttach.setAttribute('cy',teresInsert[1]);
      s.lower.shape.setAttribute('d',`M ${xy(middleMed)} Q 46,237 ${xy(lowerRoot)} L ${xy(spineRoot)} Q 39,278 4,350 Z`);
      s.middle.shape.setAttribute('d',`M ${xy(upperMed)} Q 49,166 ${xy(spineMid)} L ${xy(spineRoot)} L ${xy(lowerRoot)} Q 48,228 ${xy(middleMed)} Z`);
      s.upper.shape.setAttribute('d',`M 4,73 L 20,73 Q 29,93 38,112 Q 82,${f(134-15*lift)} ${xy(acromion)} L ${xy(spineOuter)} L ${xy(spineMid)} Q 49,166 ${xy(upperMed)} Z`);
      fibers(s.upper,t=>t<.25?mix([20,75],[5,104],t/.25):mix([5,104],upperMed,(t-.25)/.75),t=>mix(acromion,spineMid,t),-3);
      fibers(s.middle,t=>mix(upperMed,middleMed,t),t=>mix(spineMid,lowerRoot,t),0);
      fibers(s.lower,t=>mix(middleMed,[5,346],t),t=>mix(lowerRoot,spineRoot,t),3);
      fibers(s.lat,t=>t<.55?mix([7,282],[9,387],t/.55):mix([9,387],[101,438],(t-.55)/.45),t=>mix(fold,foldLow,t),17+9*lift);
      s.tendon.setAttribute('d',`M ${xy(mix(fold,foldLow,.5))} Q ${xy(at(38,-9))} ${xy(insert)}`);
      s.attach.setAttribute('cx',insert[0]);s.attach.setAttribute('cy',insert[1]);
      const pivot=S([112,209]),radius=100;
      const p0=add(pivot,[5,radius]),p1=add(pivot,[60,80]),p2=add(pivot,[84,42]);
      s.rotation.setAttribute('d',`M ${xy(p0)} Q ${xy(p1)} ${xy(p2)} M ${xy(add(p2,[-9,4]))} L ${xy(p2)} L ${xy(add(p2,[1,10]))}`);
      s.rotation.style.display=transparentCheck.checked&&angle>45?'':'none';
    }
    const screen=p=>[width/2+p[0]*scale,offset+p[1]*scale];
    const leader=(l,position,target)=>{const p=screen(position),q=screen(target);l.t.setAttribute('x',p[0]);l.t.setAttribute('y',p[1]);l.line.setAttribute('d',`M ${f(p[0])},${f(p[1]-5)} L ${xy(q)}`);};
    const inferior=S([89,294]);
    // Keep muscle names visible at mobile widths; the text stays in screen
    // coordinates while leaders follow the actual moving anatomy.
    const named=(l,left,y,target)=>{
      const x=left?8:width-8,py=offset+y*scale,q=screen(target);
      l.t.setAttribute('text-anchor',left?'start':'end');
      l.t.setAttribute('x',x);l.t.setAttribute('y',py);
      l.line.setAttribute('d',`M ${f(x)},${f(py+4)} L ${xy(q)}`);
      l.g.style.display='';
    };
    named(upperLabel,true,105,[-65,132-10*lift]);
    named(middleLabel,true,226,[-46,196]);
    named(lowerLabel,true,349,[-25,272]);
    named(latLabel,false,445,[72,380]);
    named(teresLabel,false,354,mix(teresOriginMid,teresEndMid,.5));
    named(infraLabel,false,261,S([127,213]));
    named(minorLabel,false,169,mix(mix(minorOriginUpper,minorOriginLower,.5),mix(minorEndUpper,minorEndLower,.5),.5));
    // Dashed leaders identify the deep cuff layer when the overlying muscles
    // are opaque; names still identify all muscles in the drawing.
    [infraLabel,minorLabel].forEach(l=>l.line.setAttribute('stroke-dasharray',transparentCheck.checked?'':'3 2'));
    leader(scapLabel,[-230,395],[-inferior[0],inferior[1]]);
    leader(fasciaLabel,[0,486],[0,412]);
    leader(insertionLabel,[260,390],insert);
    scapLabel.g.style.display=transparentCheck.checked&&width>=600?'':'none';
    insertionLabel.g.style.display=width>=760?'':'none';
    fasciaLabel.g.style.display=width>=600?'':'none';
    root.dataset.revision='named-back-v2';
    value.textContent=Math.round(angle)+'°';slider.value=Math.round(angle);slider.setAttribute('aria-valuetext',`${Math.round(angle)}도`);
    root.dataset.angle=String(f(angle));root.dataset.scapularRotation=String(f(up));
  }
  function resize(){
    width=root.clientWidth;scale=width/870;offset=70*scale;
    const height=565*scale+10;
    svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('height',height);
    drawing.setAttribute('transform',`translate(${width/2} ${offset}) scale(${scale})`);draw();
  }
  function sync(){
    play.textContent=playing?'일시정지':'재생';root.classList.toggle('no-fibers',!fiberCheck.checked);root.classList.toggle('transparent',transparentCheck.checked);
  }
  function save(){
    if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{topic:'팔 올릴 때의 등',angle:Math.round(angle),fibers:fiberCheck.checked,transparent:transparentCheck.checked},privateContent:{playing}}).catch(()=>{});
  }
  function restore(state){
    const v=state?.modelContent;if(!v||v.topic!=='팔 올릴 때의 등')return;
    if(Number.isFinite(v.angle)){angle=Math.max(15,Math.min(150,v.angle));phase=Math.acos(1-2*(angle-15)/135);}
    if(typeof v.fibers==='boolean')fiberCheck.checked=v.fibers;
    if(typeof v.transparent==='boolean')transparentCheck.checked=v.transparent;
    if(typeof state.privateContent?.playing==='boolean')playing=state.privateContent.playing;
    sync();draw();
  }
  play.addEventListener('click',()=>{interacted=true;playing=!playing;sync();save();});
  slider.addEventListener('input',()=>{interacted=true;playing=false;angle=Number(slider.value);phase=Math.acos(1-2*(angle-15)/135);sync();draw();});
  slider.addEventListener('change',save);
  [fiberCheck,transparentCheck].forEach(c=>c.addEventListener('change',()=>{interacted=true;sync();draw();save();}));

    if(playing&&!document.hidden){phase+=dt*Math.PI/5.5;angle=15+135*(1-Math.cos(phase))/2;draw();}
    if(root.isConnected)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>


<script>
(() => {
  const root=document.getElementById('back-motion'),scene=root.querySelector('svg');
  let pending=false;
  function fit(){
    pending=false;
    const available=Math.max(0,document.documentElement.clientWidth-32);
    const overhead=root.scrollHeight-scene.getBoundingClientRect().height;
    const heightWidth=(innerHeight-overhead-48)/0.6494252873563219;
    const width=Math.min(available,1100,Math.max(280,heightWidth));
    const next=Math.floor(width)+'px';
    if(root.style.width!==next)root.style.width=next;
  }
  const queue=()=>{if(!pending){pending=true;requestAnimationFrame(fit);}};
  new ResizeObserver(queue).observe(root);window.addEventListener('resize',queue);queue();
})();
</script></body></html>
