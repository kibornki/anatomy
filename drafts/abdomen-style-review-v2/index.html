<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상체·전완·허벅지 스타일 시안</title><style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f2f4f8;color:#253144;font:16px/1.5 system-ui,sans-serif}main{max-width:1484px;margin:auto}h1{font-size:23px;margin:0 0 8px}p{margin:0 0 18px;color:#596579}section{margin:20px 0;background:white;border:1px solid #dbe1ea;border-radius:12px;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid #e5e9ef}h2{font-size:19px;margin:0}.switch{display:flex;gap:4px}button{font:inherit;font-size:14px;padding:7px 13px;border:1px solid #cfd7e3;border-radius:7px;background:white;color:#253144;cursor:pointer}button[aria-pressed=true]{background:#253144;color:white;border-color:#253144}a{display:block}img{width:100%;height:auto;display:block}footer{font-size:13px;color:#64748a;margin:18px 0}button:focus-visible,a:focus-visible{outline:3px solid #339cff;outline-offset:3px}@media(max-width:600px){body{padding:12px}h1{font-size:20px}header{padding:12px}button{padding:6px 10px}p{font-size:14px}}
</style></head><body><main><h1>상체·전완·허벅지 스타일 시안</h1><p>같은 자세의 정면·측면·후면 비교입니다. 사진을 누르면 크게 볼 수 있습니다.</p>
<section data-region="upperbody"><header><h2>상체</h2><div class="switch" aria-label="상체 비교"><button data-mode="after" aria-pressed="true">시안</button><button data-mode="before" aria-pressed="false">기존</button></div></header><a href="upperbody.png"><img src="upperbody.png" alt="상체 시안: 정면·측면·후면"></a></section>
<section data-region="forearm"><header><h2>전완</h2><div class="switch" aria-label="전완 비교"><button data-mode="after" aria-pressed="true">시안</button><button data-mode="before" aria-pressed="false">기존</button></div></header><a href="forearm.png"><img src="forearm.png" alt="전완 시안: 정면·측면·후면"></a></section>
<section data-region="thigh"><header><h2>허벅지</h2><div class="switch" aria-label="허벅지 비교"><button data-mode="after" aria-pressed="true">시안</button><button data-mode="before" aria-pressed="false">기존</button></div></header><a href="thigh.png"><img src="thigh.png" alt="허벅지 시안: 정면·측면·후면"></a></section>
<footer>복부와 같은 색면·근섬유·힘줄·골격 표현을 적용한 이미지 시안입니다.</footer></main><script>
for(const section of document.querySelectorAll('[data-region]'))for(const button of section.querySelectorAll('button'))button.addEventListener('click',()=>{const before=button.dataset.mode==='before',file=section.dataset.region+(before?'-before':'')+'.png';section.querySelector('img').src=file;section.querySelector('a').href=file;section.querySelector('img').alt=section.querySelector('h2').textContent+' '+(before?'기존':'시안')+': 정면·측면·후면';for(const b of section.querySelectorAll('button'))b.setAttribute('aria-pressed',b===button);});
</script></body></html>
