}

}

* {

}

html > body {

}

}

h3,
h4,
h5,

  font-weight: var(--font-weight-medium);

}

b,

}

}

  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

  overflow-wrap: break-word;
}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

}

.form-check:not(.form-switch)

}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);

}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;

  height: 100%;
  background: var(--primary-foreground);

  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;

}

    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),

.form-check:not(.form-switch) .form-check-input:focus-visible {

}

.form-check:not(.form-switch) .form-check-input:disabled {

}

  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

</style></head><body><div id="abdomen" class="diagram"><h2>복부 근육과 몸통 움직임</h2><div class="text-small diagram-caption">전거근·외복사근·내복사근·복직근·광배근</div><svg class="diagram-scene" role="img" aria-labelledby="abdomen-title abdomen-desc"><title id="abdomen-title">복부 근육과 몸통 움직임</title><desc id="abdomen-desc">복부와 광배근 도해. 정면과 측면의 상체 척추 C자 말기, 골반을 고정하고 척추 축을 따라 흉곽과 견갑대를 함께 돌리는 비틀기를 제공합니다. 비틀기는 정면과 같은 16도 사선 시점입니다. 근육과 최대 회전 자세는 작화용 근사입니다.</desc><defs></defs><g class="diagram-volumes"></g><g class="diagram-labels"></g></svg><div class="diagram-legend text-small"></div><div class="diagram-controls"><div class="diagram-top"><div class="viz-row"><button type="button" class="btn btn-primary" id="abdomen-play" aria-pressed="false">재생</button><label class="form-check"><input type="checkbox" class="form-check-input" id="abdomen-fibers" checked><span class="form-check-label">근섬유</span></label><label class="form-check"><input type="checkbox" class="form-check-input" id="abdomen-transparent"><span class="form-check-label">근육 반투명</span></label></div><div class="diagram-views" role="group" aria-label="보기 방향"><button type="button" class="btn" id="abdomen-front" aria-pressed="false">정면</button><button type="button" class="btn" id="abdomen-side" aria-pressed="false">측면</button><button type="button" class="btn" id="abdomen-twist" aria-pressed="true">비틀기</button></div></div><label class="form-label" for="abdomen-angle"><span id="abdomen-motion-label">척추 비틀기</span><output id="abdomen-value" class="tabular-nums">135°</output></label><input type="range" class="form-range" id="abdomen-angle" min="-140" max="140" value="135" step="1" aria-label="몸통 움직임"></div><div class="text-small diagram-note" id="abdomen-note">골반 고정 · 상체 좌우 비틀기 · 절개창: 내복사근</div></div><script>/* Original coronal drawing landmarks. OpenStax A&P 2e 7.3/7.4/8.3/11.5

const ClassicCoronalAnatomy=(()=>{
 // Width corrections are relative to textbook drawings, not clinical norms.

 const proportions={axialWidth:.77,girdleWidth:.70,pelvisWidth:.86,humerusLength:1.18};

 const vertebrae=[...Array.from({length:7},(_,i)=>({id:'C'+(i+1),region:'cervical',y:83+i*12,w:9})),...Array.from({length:12},(_,i)=>({id:'T'+(i+1),region:'thoracic',y:173+i*16,w:11+i*.15})),...Array.from({length:5},(_,i)=>({id:'L'+(i+1),region:'lumbar',y:373+i*18,w:15+i*.4}))];
 const extents=[88,103,117,128,134,137,138,135,127,115,93,70];
 const anterior=[[49,191],[55,216],[61,235],[67,253],[73,272],[79,288],[85,302],[96,321],[100,342],[98,363],[67,377],[49,386]];
 const sternumY=[178,202,220,237,253,269,283];

 const ribPoint=(r,t)=>{const u=1-t,a=[r.extent,r.y+10],b=[r.extent+3,r.y+27],c=[r.end[0]+18,r.end[1]-4],d=r.end;return [0,1].map(k=>u*u*u*a[k]+3*u*u*t*b[k]+3*u*t*t*c[k]+t*t*t*d[k]);};
 const serratusOrigins=ribs.slice(0,8).map(r=>body(ribPoint(r,.2)));
 function girdle(angle){
  const lift=(angle-15)/105,up=30*lift,r=-up*Math.PI/180;
  const S=p=>{const x=p[0]-112,y=(p[1]-190)*.9;return [(112+x*Math.cos(r)-y*Math.sin(r)+5*lift)*proportions.girdleWidth,190+x*Math.sin(r)+y*Math.cos(r)-12*lift];};
  const a=angle*Math.PI/180,d=[Math.sin(a),Math.cos(a)],n=[Math.cos(a),-Math.sin(a)],g=S([165,176]);

  const column=el('g',{'data-part':'coronal-vertebrae'},axial);
  for(const v of vertebrae){
   const g=el('g',{'data-vertebra':v.id,'data-region':v.region},column),{w,y}=v;

   if(view==='back')path(`M -3,${y+3} L 3,${y+3} L 4,${y+12} L 0,${y+15} L -4,${y+12} Z`,'bone',g);
  }
  for(const sign of [-1,1]){
   const side=el('g',{transform:`scale(${sign} 1)`,'data-side':sign},axial);
   for(const r of ribs){
    const g=el('g',{'data-rib':r.number,'data-rib-type':r.type},side),{y,extent:x,end:e}=r;
    // Open rib arc, with a separate anterior end. The small floating ribs
    // finish laterally, without adding them to the anterior costal arch.
    const curve=`M 13,${y} C 51,${y-13} ${x-10},${y-17} ${x},${y+10} C ${x+3},${y+27} ${e[0]+18},${e[1]-4} ${e[0]},${e[1]}`;
    if(view==='front')path(curve,'rib-outline',g);
