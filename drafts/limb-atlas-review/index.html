<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전완·허벅지 아틀라스 시안</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#f2f4f8;color:#253144;font:16px/1.5 system-ui,sans-serif}main{max-width:800px;margin:auto}h1{font-size:22px;margin:0 0 8px}p{color:#596579;margin:0 0 16px}.controls{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}button{font:inherit;border:1px solid #cbd5e1;background:white;color:#253144;border-radius:8px;padding:9px 20px;cursor:pointer}button[aria-pressed=true]{background:#253144;color:white}.picture{background:white;border:1px solid #dbe1ea;border-radius:12px;overflow:hidden}img{display:block;width:100%;height:auto}footer{font-size:12px;color:#64748a;margin-top:16px}footer a{color:inherit}.all{display:inline-block;margin-top:14px;color:#276ab9}button:focus-visible,a:focus-visible{outline:3px solid #339cff;outline-offset:3px}</style></head><body><main><h1 id="heading">전완 · 실제 뼈와 근육 표면 시안</h1><p id="pose">회외 자세 · 사진을 누르면 확대해서 볼 수 있습니다.</p><div class="controls" aria-label="부위"><button data-region="forearm" aria-pressed="true">전완</button><button data-region="thigh" aria-pressed="false">허벅지</button></div><div class="controls" aria-label="시점"><button data-view="front" aria-pressed="true">정면</button><button data-view="side" aria-pressed="false">측면</button><button data-view="back" aria-pressed="false">후면</button></div><div class="picture"><a id="picture-link" href="forearm-front.png?v=native1"><img id="picture" src="forearm-front.png?v=native1" alt="전완 정면 시안"></a></div><a class="all" id="all" href="forearm.png?v=native1">세 시점 한 번에 보기</a><footer>팔·복부·상체와 동일한 <a href="https://github.com/Kevin-Mattheus-Moerman/BodyParts3D/tree/f0eeb6e843380cfe6b83797cf8c3e1af74de5e61">BodyParts3D</a> 원본 표면 기반.<br>근섬유와 흰 힘줄 구분은 작화 가이드입니다. 적용 전 정지 시안입니다.<br>BodyParts3D © 2008 DBCLS · <a href="https://creativecommons.org/licenses/by-sa/2.1/jp/">CC BY-SA 2.1 Japan</a> · STL conversion: Kevin Mattheus Moerman</footer></main><script>let region=new URLSearchParams(location.search).get('part')==='thigh'?'thigh':'forearm',view='front';const label={forearm:'전완',thigh:'허벅지'},viewLabel={front:'정면',side:'측면',back:'후면'};function draw(){const file=region+'-'+view+'.png?v=native1';document.querySelector('#heading').textContent=label[region]+' · 실제 뼈와 근육 표면 시안';document.querySelector('#pose').textContent=(region==='forearm'?'회외 자세':'무릎 폄 자세 · 무릎 조금 아래까지만 표시')+' · 사진을 누르면 확대해서 볼 수 있습니다.';document.querySelector('#picture').src=file;document.querySelector('#picture').alt=label[region]+' '+viewLabel[view]+' 시안';document.querySelector('#picture-link').href=file;document.querySelector('#all').href=region+'.png?v=native1';for(const b of document.querySelectorAll('[data-region]'))b.setAttribute('aria-pressed',b.dataset.region===region);for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',b.dataset.view===view);}for(const b of document.querySelectorAll('[data-region]'))b.onclick=()=>{region=b.dataset.region;draw();};for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;draw();};draw();</script></body></html>
