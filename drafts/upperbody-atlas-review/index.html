<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상체 아틀라스 시안</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#f2f4f8;color:#253144;font:16px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto}h1{font-size:22px;margin:0 0 8px}p{color:#596579;margin:0 0 16px}.views{display:flex;gap:6px;margin:16px 0}button{font:inherit;border:1px solid #cbd5e1;background:white;color:#253144;border-radius:8px;padding:9px 20px;cursor:pointer}button[aria-pressed=true]{background:#253144;color:white}.picture{background:white;border:1px solid #dbe1ea;border-radius:12px;overflow:hidden}img{display:block;width:100%;height:auto}footer{font-size:12px;color:#64748a;margin-top:16px}footer a{color:inherit}.all{display:inline-block;margin-top:14px;color:#276ab9}button:focus-visible,a:focus-visible{outline:3px solid #339cff;outline-offset:3px}</style></head><body><main><h1>상체 · 실제 뼈와 근육 표면 시안</h1><p>팔 외전 60° · 대흉근·전거근·등 근육<br>사진을 누르면 확대해서 볼 수 있습니다.</p><div class="views" aria-label="상체 시점"><button data-view="front" aria-pressed="true">정면</button><button data-view="side" aria-pressed="false">측면</button><button data-view="back" aria-pressed="false">후면</button></div><div class="picture"><a id="picture-link" href="front.png"><img id="picture" src="front.png" alt="상체 정면 시안"></a></div><a class="all" href="upperbody.png">세 시점 한 번에 보기</a><footer>팔·복부와 동일한 <a href="https://github.com/Kevin-Mattheus-Moerman/BodyParts3D/tree/f0eeb6e843380cfe6b83797cf8c3e1af74de5e61">BodyParts3D</a> 원본 자료 기반. 팔 올림 변형과 근섬유는 도해용 근사입니다.<br>BodyParts3D © 2008 DBCLS · <a href="https://creativecommons.org/licenses/by-sa/2.1/jp/">CC BY-SA 2.1 Japan</a> · STL conversion: Kevin Mattheus Moerman</footer></main><script>for(const b of document.querySelectorAll('button'))b.addEventListener('click',()=>{const file=b.dataset.view+'.png';document.querySelector('#picture').src=file;document.querySelector('#picture').alt='상체 '+b.textContent+' 시안';document.querySelector('#picture-link').href=file;for(const button of document.querySelectorAll('button'))button.setAttribute('aria-pressed',button===b);});</script></body></html>
