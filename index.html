ue\", \"text\": \"흉늑부\"}, {\"kind\": \"green\", \"text\": \"복부\"}, {\"kind\": \"orange\", \"text\": \"전거근\"}], \"back\": [{\"kind\": \"red\", \"text\": \"승모근 상부\"}, {\"kind\": \"blue\", \"text\": \"중부\"}, {\"kind\": \"green\", \"text\": \"하부\"}, {\"kind\": \"purple\", \"text\": \"광배근\"}, {\"kind\": \"orange\", \"text\": \"대원근\"}, {\"kind\": \"yellow\", \"text\": \"극하근\"}, {\"kind\": \"teal\", \"text\": \"소원근\"}], \"side\": [{\"kind\": \"red\", \"text\": \"대흉근 쇄골부\"}, {\"kind\": \"blue\", \"text\": \"흉늑부\"}, {\"kind\": \"purple\", \"text\": \"광배근\"}, {\"kind\": \"orange\", \"text\": \"전거근\"}]}, \"label\": \"상체\", \"renderer\": \"classic\"}\u003c/script>\u003cscript>function ClassicChest(host){\nconst root=host;\n  const svg = root.querySelector('svg');\n  const drawing = root.querySelector('.pm-drawing');\n  const labelLayer = root.querySelector('.pm-labels');\n  const axial = root.querySelector('.pm-axial');\n  const slider = root.querySelector('#upperbody-angle');\n  const value = root.querySelector('#upperbody-value');\n  const play = root.querySelector('#upperbody-play');\n  const fiberCheck = root.querySelector('#upperbody-fibers');\n  const transparencyCheck = root.querySelector('#upperbody-transparent');\n  const NS='http://www.w3.org/2000/svg';\n  const el=(name,attrs,parent)=>{const n=document.createElementNS(NS,name);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));parent.appendChild(n);return n;};\n  const path=(d,cls,parent)=>el('path',{d,class:cls},parent);\n  const f=n=>Math.round(n*100)/100;\n  const xy=p=>`${f(p[0])},${f(p[1])}`;\n  const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];\n  let angle=60, phase=Math.acos(1-2*(60-15)/105), playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;\n  let width=600,scale=1,top=0,lastTime=0,interacted=false;\n  // Frontal schematic coordinates. The scapular/clavicular coupling is illustrative,\n  // not a measured, patient-specific kinematic model. No force/activation inference.\n  for(let i=0;i\u003c6;i++){\n    const y=78+i*12;\n    path(`M -10,${y} Q 0,${y-3} 10,${y} L 12,${y+8} Q 0,${y+12} -12,${y+8} Z`,'bone',axial);\n  }\n  // Paired ribs and anterior costal cartilages, cropped to the thoracic region.\n  for(const side of [-1,1]){\n    const ribs=el('g',{transform:`scale(${side} 1)`},axial);\n    for(let i=0;i\u003c10;i++){\n      const y=153+i*17, x=93+Math.sin((i+1)/11*Math.PI)*43;\n      const endY=i\u003c7?164+i*20:285+(i-6)*10;\n      const endX=i\u003c7?17:21+(i-6)*12;\n      const tipX=43+i*3,tipY=y+32;\n      path(`M 15,${y-9} C 73,${y-22} ${x},${y-12} ${x+1},${y+5} C ${x+5},${y+22} 93,${tipY+10} ${tipX},${tipY} L ${tipX+2},${tipY-7} C 91,${tipY+1} ${x-6},${y+17} ${x-7},${y+5} C ${x-9},${y-4} 66,${y-12} 17,${y-1} Z`,'rib',ribs);\n      path(`M ${tipX+2},${tipY-7} Q 39,${tipY-9} ${endX},${endY} L ${endX},${endY+7} Q 40,${tipY+1} ${tipX},${tipY} Z`,'cartilage',ribs);\n    }\n  }\n  path('M -17,142 Q -10,137 -7,146 L 7,146 Q 10,137 17,142 L 20,170 L 12,185 L 11,276 Q 16,285 7,292 L 0,314 L -7,292 Q -16,285 -11,276 L -12,185 L -20,170 Z','bone',axial);\n  path('M -12,183 L 12,183 M -10,211 L 10,211 M -10,238 L 10,238 M -9,266 L 9,266','bone-detail',axial);\n  const sides=[root.querySelector('.pm-left'),root.querySelector('.pm-right')].map((group,index)=>{\n    const scap=el('g',{},group); el('use',{href:'#pm-scapula',class:'bone',opacity:'.55'},scap);\n    path('M 99,174 Q 125,169 151,179 M 111,283 Q 106,224 119,182','bone-detail',scap);\n    const clav=path('','bone',group);\n    const arm=el('g',{},group); el('use',{href:'#pm-humerus',class:'bone'},arm);\n    path('M -20,19 Q -1,29 18,13 M 1,35 Q 5,83 2,138 M -7,160 Q 1,151 11,161','bone-detail',arm);\n    // Proximal forearm, kept in extension to clarify the arm direction.\n    path('M -13,178 Q -6,174 -2,182 L -4,244 Q -8,255 -12,246 L -11,199 Z','bone',arm);\n    path('M 5,181 Q 11,177 16,183 L 15,242 Q 19,252 12,253 L 6,250 L 9,204 Z','bone',arm);\n    const layer=el('g',{class:'muscle-layer'},group);\n    const abdomen=path('','muscle abdominal',layer),af=el('g',{class:'fibers'},layer);\n    const sternum=path('','muscle sternal',layer),sf=el('g',{class:'fibers'},layer);\n    const clavicle=path('','muscle clavicular',layer),cf=el('g',{class:'fibers'},layer);\n    [[abdomen,af],[sternum,sf],[clavicle,cf]].forEach(([shape,fibers],j)=>{\n      const id=`pm-region-${index}-${j}`;shape.id=id;\n      const clip=el('clipPath',{id:`${id}-clip`},svg.querySelector('defs'));\n      el('use',{href:`#${id}`},clip);fibers.setAttribute('clip-path',`url(#${id}-clip)`);\n    });\n    const tendon=path('','tendon',layer);\n    const attach=el('circle',{r:3.8,class:'attachment'},layer);\n    const lines=(g,n)=>Array.from({length:n},()=>path('','fiber',g));\n    return {scap,clav,arm,abdomen,sternum,clavicle,tendon,attach,al:lines(af,8),sl:lines(sf,27),cl:lines(cf,13)};\n  });\n  const label=(text)=>{const g=el('g',{},labelLayer);const line=path('','',g);const t=el('text',{'text-anchor':'middle'},g);t.textContent=text;return {g,line,t};};\n  const clavLabel=label('쇄골'),sternumLabel=label('흉골'),scapLabel=label('견갑골');\n  function draw(){\n    const a=angle*Math.PI/180, lift=(angle-15)/105;\n    const H=[170-5*lift,164-22*lift];\n    const d=[Math.sin(a),Math.cos(a)],n=[Math.cos(a),-Math.sin(a)];\n    const at=(s,o=0)=>[H[0]+d[0]*s+n[0]*o,H[1]+d[1]*s+n[1]*o];\n    // Broad humeral attachment follows the proximal shaft, below its head.\n    const proximal=at(34,-8),distal=at(72,-8),mid=at(53,-8);\n    const bellyProx=[proximal[0]-10,proximal[1]+1],bellyDist=[distal[0]-10,distal[1]+1];\n    const co0=[22,153-2*lift],co1=[88,155-12*lift];\n    for(const s of sides){\n      s.scap.setAttribute('transform',`translate(${-5*lift} ${-22*lift}) rotate(${-30*lift} 157 170)`);\n      s.arm.setAttribute('transform',`translate(${xy(H)}) rotate(${-angle})`);\n      const cy=150-19*lift;\n      s.clav.setAttribute('d',`M 18,144 Q 47,137 81,${f(cy-3)} T 151,${f(cy-6)} Q 165,$ apture);\n})();\n\u003c/script>\n\u003cdiv id=\"arm\" class=\"diagram\">\u003ch2>팔 근육과 팔꿈치 굽힘\u003c/h2>\u003cdiv class=\"text-small diagram-caption\">오른팔 · 이두·삼두·삼각근\u003c/div>\u003csvg class=\"diagram-scene\" role=\"img\" aria-labelledby=\"arm-title arm-desc\">\u003ctitle id=\"arm-title\">팔 근육과 팔꿈치 굽힘\u003c/title>\u003cdesc id=\"arm-desc\">상완이두근과 상완삼두근, 삼각근을 같은 오른팔의 정면·후면·측면에서 살펴봅니다. 이두근은 요골 조면으로, 삼두근은 척골 주두로 이어집니다. 삼각근은 쇄골부·견봉부·견갑극부가 상완골 삼각근 조면으로 모이며 팔꿈치 굽힘에서는 어깨와 상완골이 고정됩니다. 상완근은 깊은층입니다. 근육 변형은 경로 길이에 따른 작화용 표현이며 근활성도나 실제 수축률을 계산하지 않습니다.\u003c/desc>\u003cdefs>\u003c/defs>\u003cg class=\"diagram-volumes\">\u003c/g>\u003cg class=\"diagram-labels\">\u003c/g>\u003c/svg>\u003cdiv class=\"diagram-legend text-small\">\u003c/div>\u003cdiv class=\"diagram-controls\">\u003cdiv class=\"diagram-top\">\u003cdiv class=\"viz-row\">\u003cbutton type=\"button\" class=\"btn btn-primary\" id=\"arm-play\" aria-pressed=\"true\">일시정지\u003c/button>\u003clabel class=\"form-check\">\u003cinput type=\"checkbox\" class=\"form-check-input\" id=\"arm-fibers\" checked>\u003cspan class=\"form-check-label\">근섬유\u003c/span>\u003c/label>\u003clabel class=\"form-check\">\u003cinput type=\"checkbox\" class=\"form-check-input\" id=\"arm-transparent\">\u003cspan class=\"form-check-label\">근육 반투명\u003c/span>\u003c/label>\u003c/div>\u003cdiv class=\"diagram-views\" role=\"group\" aria-label=\"보기 방향\">\u003cbutton type=\"button\" class=\"btn\" id=\"arm-front\" aria-pressed=\"true\">정면\u003c/button>\u003cbutton type=\"button\" class=\"btn\" id=\"arm-back\" aria-pressed=\"false\">후면\u003c/button>\u003cbutton type=\"button\" class=\"btn\" id=\"arm-side\" aria-pressed=\"false\">측면\u003c/button>\u003c/div>\u003c/div>\u003clabel class=\"form-label\" for=\"arm-angle\">팔꿈치 굽힘\u003coutput id=\"arm-value\" class=\"tabular-nums\">55°\u003c/output>\u003c/label>\u003cinput type=\"range\" class=\"form-range\" id=\"arm-angle\" min=\"0\" max=\"135\" value=\"55\" step=\"1\" aria-label=\"팔꿈치 굽힘\">\u003c/div>\u003cdiv cla oid-acromial\"], \"text\": \"삼각근 견봉부\", \"side\": \"right\", \"y\": 150}, {\"ids\": [\"biceps-long\", \"biceps-short\"], \"text\": \"상완이두근\", \"side\": \"right\", \"y\": 280}, {\"ids\": [\"triceps-lateral\", \"triceps-long\"], \"text\": \"상완삼두근\", \"side\": \"left\", \"y\": 255}, {\"ids\": [\"brachialis\"], \"text\": \"상완근 · 깊은층\", \"side\": \"right\", \"y\": 405, \"onlyTransparent\": true, \"deep\": true}]}, \"legend\": {\"front\": [{\"kind\": \"red\", \"text\": \"이두근 장두\"}, {\"kind\": \"blue\", \"text\": \"단두\"}, {\"kind\": \"purple\", \"text\": \"삼각근 쇄골부\"}, {\"kind\": \"orange\", \"text\": \"견봉부\"}], \"back\": [{\"kind\": \"red\", \"text\": \"삼두근 장두\"}, {\"kind\": \"blue\", \"text\": \"외측두\"}, {\"kind\": \"green\", \"text\": \"내측두·깊은층\"}, {\"kind\": \"yellow\", \"text\": \"삼각근 견갑극부\"}, {\"kind\": \"orange\", \"text\": \"견봉부\"}], \"side\": [{\"kind\": \"red\", \"text\": \"이두·삼두 장두\"}, {\"kind\": \"blue\", \"text\": \"이두 단두·삼두 외측두\"}, {\"kind\": \"orange\", \"text\": \"삼각근 견봉부\"}]}, \"label\": \"팔\"}\u003c/script>\u003cscript>/* Shared original schematic geometry. X: subject's right, Y: inferior,\n   Z: anterior. These surfaces are illustrative, not measured anatomy. */\nconst AnatomyGeometry=(()=>{\n const N=24,add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),mul=(a,k)=>a.map(v=>v*k);\n const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];\n const unit=p=>mul(p,1/(Math.hypot(...p)||1)),mix=(a,b,t)=>add(mul(a,1-t),mul(b,t));\n function section(center,rx,rz,u=[1,0,0],v=[0,0,1]){return {center,rx,rz,u,v,ring:Array.from({length:N},(_,i)=>add(center,add(mul(u,rx*Math.cos(i*2*Math.PI/N)),mul(v,rz*Math.sin(i*2*Math.PI/N)))))};}\n function dense(points,steps=3){const out=[];for(let i=0;i\u003cpoints.length-1;i++)for(let j=0;j\u003csteps;j++){const t=j/steps,a=points[Math.max(0,i-1)],b=points[i],c=points[i+1],d=points[Math.min(points.length-1,i+2)];out.push(b.map((v,k)=>.5*(2*v+(-a[k]+c[k])*t+(2*a[k]-5*v+4*c[k]-d[k])*t*t+(-a[k]+3*v-3*c[k]+d[k])*t*t*t)));}return out.concat([points.at(-1)]);}\n function tube(stations,transform=p=>p){return dense(stations).map(([y,x,z,rx,rz])=>{const s=section([x,y,z],Math.max(.5,rx),Math.max(.5,rz));return {...s,center:transform(s.center),ring:s.ring.map(transform)};});}\n function sweep(points,radii,steps=2){const data=dense(points.map((p,i)=>p.concat(Array.isArray(radii[i])?radii[i]:[radii[i],radii[i]])),steps);return data.map((p,i)=>{const center=p.slice(0,3),tangent=unit(sub(data[Math.min(i+1,data.length-1)].slice(0,3),data[Math.max(0,i-1)].slice(0,3)));const ref=Math.abs(tangent[0])>.9?[0,0,1]:[1,0,0],v=unit(cross(ref,tangent)),u=unit(cross(tangent,v));return section(center,Math.max(.5,p[3]),Math.max(.5,p[4]),u,v);});}\n function fan(id,kind,a,b,c,d,options={}){\n  const rows=[];for(let i=0;i\u003c=8;i++){const t=i/8,left=mix(a,c,t),right=mix(b,d,t),u=unit(sub(right,left));let v=options.normal||[0,0,1];v=unit(sub(v,mul(u,dot(u,v))));const center=add(mix(left,right,.5),mul(options.bow||[0,0,0],Math.sin(Math.PI*t)));const s=section(center,Math.max(1,Math.hypot(...sub(right,left))/2),(options.thickness||5)*(.3+.7*Math.sin(Math.PI*t)),u,v);if(options.conform){const z=s.center[2];s.ring=s.ring.map(p=>options.conform(p,z));s.center=options.conform(s.center,z);}rows.push(s);}\n  return {id,kind,rows,fiberStyle:'fan',...options.meta};\n }\n function volume(rows){let v=0;for(let i=1;i\u003crows.length;i++)v+=(rows[i][0]-rows[i-1][0])*Math.PI*(rows[i][3]*rows[i][4]+rows[i-1][3]*rows[i-1][4])/2;return v;}\n function belly(id,kind,stations,delta){const base=dense(stations),span=base.at(-1)[0]-base[0][0],stretch=(span+delta)/span;const rows=base.map(([y,x,z,rx,rz])=>[base[0][0]+(y-base[0][0])*stretch,x,z,rx/Math.sqrt(stretch),rz/Math.sqrt(stretch)]);return {id,kind,rows:rows.map(([y,x,z,rx,rz])=>section([x,y,z],rx,rz)),bellyLength:span+delta,bellyVolume:volume(rows)};}\n const C=Math.cos(32*Math.PI/180),S=Math.sin(32*Math.PI/180);\n const view=(p,camera)=>camera==='back'?[p[0]*C+p[2]*S,p[1],p[0]*S-p[2]*C]:camera==='side'?[p[2],p[1],p[0]]:[-p[0]*C+p[2]*S,p[1],p[0]*S+p[2]*C];\n const length=points=>points.slice(1).reduce((s,p,i)=>s+Math.hypot(...sub(p,points[i])),0);\n return {add,sub,mul,mix,unit,cross,dot,section,tube,sweep,fan,belly,view,length};\n})();\n\n/* Unified right upper limb: flexors anterior, extensors posterior.\n   Deltoid: lateral clavicle/acromion/scapular spine → humeral deltoid tuberosity.\n   Muscle shapes and path-derived deformation are illustrative, not measured. */\nconst ArmModel=(()=>{\n const G=AnatomyGeometry,{add,sub,mul,mix,tube,sweep,fan,belly,length}=G,E=265;\n const forearm=(p,a)=>{const t=a*Math.PI/180,y=p[1]-E;return [p[0],E+y*Math.cos(t)-p[2]*Math.sin(t),y*Math.sin(t)+p[2]*Math.cos(t)];};\n const origins={bicepsLong:[-20,-24,0],bicepsShort:[-39,-15,29],tricepsLong:[-25,29,-14]};\n const bLong=[[57,12,24,3,4],[83,13,26,12,10],[122,14,28,16,13],[163,12,29,15,12],[201,8,30,9,9],[225,4,29,3,3]];\n const bShort=[[64,-13,29,3,4],[88,-13,31,13,10],[127,-14,32,17,13],[167,-12,32,16,12],[205,-8,31,10,9],[226,-3,29,3,3]];\n const trLong=[[48,-19,-28,4,5],[82,-23,-31,13,11],[124,-23,-33,17,13],[169,-20,-33,15,12],[205,-14,-31,10,8],[229,-8,-29,4,3]];\n const trLat=[[49,11,-19,6,5],[86,16,-25,14,11],[124,18,-27,17,12],[170,18,-29,15,12],[208,11,-29,9,8],[229,4,-28,4,3]];\n const trMed=[[126,0,-12,4,4],[155,0,-15,13,9],[192,0,-18,17,11],[227,0,-21,10,7],[244,0,-23,3,3]];\n const brach=[[124,0,14,4,4],[152,0,17,16,9],[192,0,19,20,10],[229,0,20,11,7],[242,-4,19,3,3]];\n function paths(a){const radial=forearm([7,E+33,4],a),ulnar=forearm([-10,E+24,9],a),olecranon=forearm([-10,E-13,-16],a);\n  const radius=Math.hypot(13,16),start=Math.atan2(-13,16),wrap=Array.from({length:Math.max(1,Math.ceil(a/10))+1},(_,i,list)=>{const phi=start+a*Math.PI/180*i/Math.max(1,Math.ceil(a/10));return [-10,E+radius*Math.sin(phi),-radius*Math.cos(phi)];});return {\n  radial,ulnar,olecranon,wra on the\n  // appropriate side of the elbow, without an activation-based pump factor.\n  const db=length(p.biceps)-length(neutral.biceps),dt=length(p.triceps)-length(neutral.triceps),dh=length(p.brachialis)-length(neutral.brachialis);\n  const bounded=(stations,delta,maxY)=>Math.min(delta,maxY-stations.at(-1)[0]);\n  muscles.push(belly('biceps-long','red',bLong,bounded(bLong,db,Math.min(E-25,p.radial[1]-15))));\n  muscles.push(belly('biceps-short','blue',bShort,bounded(bShort,db,Math.min(E-25,p.radial[1]-15))));\n  muscles.push(belly('triceps-long','red',trLong,bounded(trLong,dt,E-17)));\n  muscles.push(belly('triceps-lateral','blue',trLat,bounded(trLat,dt,E-17)));\n  muscles.push({...belly('triceps-medial','green',trMed,bounded(trMed,dt,E-10)),deep:true});\n  muscles.push({...belly('brachialis','neutral',brach,bounded(brach,dh,Math.min(E-14,p.ulnar[1]-9))),deep:true});\n  // Distributed fleshy humeral origins connect the monoarticular heads\n  // to posterior/anterior cortex rather than leaving free spindle tips.\n  muscles.push(fan('triceps-lateral-origin','blue',[-2,43,-9],[7,111,-10],[11,49,-19],[18,124,-27],{normal:[0,0,-1],thickness:3}));\n  muscles.push(fan('triceps-medial-origin','green',[-7,129,-8],[9,219,-9],[0,145,-15],[0,221,-21],{normal:[0,0,-1],thickness:3}));\n  muscles.push(fan('brachialis-origin','neutral',[-8,123,9],[8,201,9],[0,130,15],[0,201,20],{thickness:3}));\n  const end=id=>muscles.find(x=>x.id===id).rows.at(-1).center;\n  tendons.push({id:'biceps-long-origin',rows:sweep([origins.bicepsLong,[-8,-26,10],[4,16,19],[10,47,23],muscles[0].rows[0].center],[[2,2],[3,2],[3,2],[3,2],[3,2]])});\n  tendons.push({id:'biceps-short-origin',rows:sweep([origins.bicepsShort,[-24,23,29],muscles[1].rows[0].center],[[3,2],[3,2],[3,2]])});\n  tendons.push({id:'biceps-tendon',rows:sweep([mix(end('biceps-long'),end('biceps-short'),.5),p.radial],[[6,3],[4,3]])});\n  tendons.push({id:'brachialis-tendon',rows:sweep([end('brachialis'),p.ulnar],[[4,3],[3,3]])});\n  tend omy-hub-state',key:config.key,state},'*');}};\n function capture(){\n  const root=document.getElementById('forearm-motion');if(!root)return;\n  window.openai.setWidgetState({modelContent:{topic:'아티스트 전완 회내 회외',angle:Number(root.querySelector('#forearm-angle').value),camera:root.dataset.camera,fibers:root.querySelector('#forearm-fibers').checked,transparent:root.querySelector('#forearm-transparent').checked},privateContent:{playing:root.querySelector('#forearm-play').getAttribute('aria-pressed')==='true'}});\n }\n document.addEventListener('input',()=>queueMicrotask(capture));document.addEventListener('change',()=>queueMicrotask(capture));document.addEventListener('click',()=>queueMicrotask(capture));document.addEventListener('DOMContentLoaded',capture,{once:true});window.addEventListener('pagehide',capture);\n})();\n\u003c/script>\n\u003cdiv id=\"forearm-motion\">\n  \u003ch2>전완과 손의 회전\u003c/h2>\n  \u003cdiv class=\"text-small\" id=\"forearm-view-caption\">정면에서 본 오른팔 · 팔꿈치 고정 · 회외 80°–회내 80°\u003c/div>\n  \u003csvg class=\"forearm-scene\" role=\"img\" aria-labelledby=\"forearm-title forearm-desc\">\n    \u003ctitle id=\"forearm-title\">전완 회전에 따른 근육 덩어리의 배열 변화\u003c/title>\n    \u003cdesc id=\"forearm-desc\">상완 하단과 팔꿈치 연결부를 포함한 오른팔 도해입니다. 요골이 척골 주위를 돌면서 손의 방향이 바뀝니다. 아티스트를 위한 근육 덩어리 표현이며 정면, 엄지 쪽 측면, 후면을 선택할 수 있습니다.\u003c/desc>\n    \u003cdefs>\u003c/defs>\n    \u003cg class=\"forearm-drawing\">\u003cg class=\"forearm-bones\">\u003c/g>\u003cg class=\"forearm-deep muscle-layer\">\u003c/g>\u003cg class=\"forearm-muscles muscle-layer\">\u003c/g>\u003cg class=\"forearm-landmarks\">\u003c/g>\u003c/g>\n    \u003cg class=\"forearm-labels\">\u003c/g>\n  \u003c/svg>\n  \u003cdiv class=\"forearm-legend text-small\">\n    \u003cspan>\u003ci class=\"brachio-key\">\u003c/i>상완요골근\u003c/span>\u003cspan>\u003ci class=\"flexor-key\">\u003c/i>굽힘근군\u003c/span>\u003cspan>\u003ci class=\"extensor-key\">\u003c/i>폄근군\u003c/span>\u003cspan>\u003ci class=\"pronator-key\">\u003c/i>원회내근\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"forearm-controls\">\n    \u003cdiv class=\"forearm-control-top\">\u003cdiv class=\"viz-row\">\n      \u003cbutton type=\"button\" class=\"btn btn-primary\" id=\"forearm-play\" aria-pressed=\"true\">일시정지\u003c/button>\n      \u003clabel class=\"form-check\">\u003cinput type=\"checkbox\" class=\"form-check-input\" id=\"forearm-fibers\" checked>\u003cspan class=\"form-check-label\">근섬유\u003c/span>\u003c/label>\n      \u003clabel class=\"form-check\">\u003cinput type=\"checkbox\" class=\"form-check-input\" id=\"forearm-transparent\">\u003cspan class=\"form-check-label\">근육 반투명\u003c/span>\u003c/label>\n    \u003c/div>\u003cdiv class=\"forearm-views\" role=\"group\" aria-label=\"보기 방향\">\n      \u003cbutton type=\"button\" class=\"btn\" id=\"forearm-front\" aria-pressed=\"true\">정면\u003c/button>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"forearm-side\" aria-pressed=\"false\">측면\u003c/button>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"forearm-back\" aria-pressed=\"false\">후면\u003c/button>\n    \u003c/div>\u003c/div>\n    \u003clabel class=\"form-label\" for=\"forearm-angle\">전완 회전 \u003coutput id=\"forearm-value\" class=\"tabular-nums\"> 회외 80°\u003c/output>\u003c/label>\n    \u003cinput type=\"range\" class=\"form-range\" id=\"forearm-angle\" min=\"-80\" max=\"80\" value=\"-80\" step=\"1\" aria-label=\"전완 회전, 음수는 회외 양수는 회내\">\n  \u003c/div>\n  \u003cdiv class=\"text-small forearm-note\">−80°: 회외 · 0°: 중립 · +80°: 회내 · 작화용 덩어리 도해\u003c/div>\n\u003c/div>\n\u003cstyle>\n  #forearm-motion { color:var(--foreground); --viz-series-1:var(--red); --viz-series-2:var(--blue); --viz-series-3:var(--green); --viz-series-4:var(--purple); }\n  #forearm-motion h2 { margin-bottom:4px; }\n  #forearm-motion .forearm-scene { display:block; width:100%; margin:8px 0 10px; }\n  #forearm-motion .forearm-legend { display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:center; }\n  #forearm-motion .forearm-legend span { display:inline-flex; align-items:center; gap:6px; }\n  #forearm-motion .forearm-legend i { width:10px; height:10px; border-radius:50%; }\n  #forearm-motion .brachio-key { background:var(--viz-series-1); }\n  #forearm-motion .flexor-key { background:var(--viz-series-2); }\n  #forearm-motion .extensor-key { background:var(--viz-series-3); }\n  #forearm-motion .pronator-key { background:var(--viz-series-4); }\n  #forearm-motion .forearm-controls { display:grid; gap:12px; margin:18px 0 12px; }\n  #forearm-motion .forearm-control-top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }\n  #forearm-motion .forearm-views { display:flex; gap:4px; margin-left:auto; }\n  #forearm-motion .forearm-views .btn { padding:5px 12px; border:1px solid color-mix(in srgb,var(--muted-foreground) 30%,var(--background)); color:var(--foreground); background:var(--background); }\n  #forearm-motion .forearm-views .btn[aria-pressed=\"true\"] { background:var(--foreground); color:var(--background); border-color:var(--foreground); }\n  #forearm-motion .form-label { display:flex; justify-content:space-between; }\n  #forearm-motion .forearm-note { color:var(--muted-foreground); }\n  #forearm-motion .bone { fill:var(--muted); stroke:var(--foreground); stroke-width:1.25; stroke-linejoin:round; }\n  #forearm-motion .bone-detail { fill:none; stroke:var(--muted-foreground); stroke-width:.9; }\n  #forearm-motion .muscle { stroke:var(--foreground); stroke-opacity:.65; stroke-width:1.1; stroke-linejoin:round; }\n  #forearm-motion .brachio { fill:color-mix(in srgb,var(--viz-series-1) 66%,var(--background)); }\n  #forearm-motion .flexor { fill:color-mix(in srgb,var(--viz-series-2) 62%,var(--background)); }\n  #forearm-motion .extensor { fill:color-mix(in srgb,var(--viz-series-3) 58%,var(--background)); }\n  #forearm-motion .pronator { fill:color-mix(in srgb,var(--viz-series-4) 55%,var(--background)); }\n  #forearm-motion .deep { fill:color-mix(in srgb,var(--muted-foreground) 25%,var(--background)); }\n  #forearm-motion .tendon { fill:var(--background); stroke:var(--foreground); stroke-width:1.1; }\n  #forearm-motion .fiber { fill:none; stroke:var(--foreground); stroke-opacity:.32; stroke-width:.7; }\n  #forearm-motion .landmark { fill:var(--background); stroke:var(--foreground); stroke-width:1.5; }\n  #forearm-motion .forearm-labels { fill:var(--foreground); }\n  #forearm-motion .forearm-labels text { font-size:12px; }\n  #forearm-motion .forearm-labels path { fill:none; stroke:var(--muted-foreground); stroke-width:.9; }\n  #forearm-motion .forearm-deep { display:none; }\n  #forearm-motion.transparent .forearm-deep { display:inline; }\n  #forearm-motion.transparent .muscle-layer { opacity:.3; }\n  #forearm-motion.no-fibers .fibers { display:none; }\n\u003c/style>\n\u003cscript>/* Original artist-oriented construction model. Units and outlines are schematic.\n   Radius and hand use one rigid rotation about radial head → distal ulnar head.\n   Muscle masses interpolate their proximal and distal frames; they do not encode activation. */\nconst ForearmModel = (() => {\n  const add=(a,b)=>a.map((v,i)=>v+b[i]);\n  const sub=(a,b)=>a.map((v,i)=>v-b[i]);\n  const mul=(a,s)=>a.map(v=>v*s);\n  const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);\n  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];\n  const norm=a=>Math.hypot(...a), unit=a=>mul(a,1/norm(a));\n  const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);\n  const A=[-27,0,0], B=[23,308,0], K=unit(sub(B,A));\n  const rad=d=>d*Math.PI/180;\n  function rotate(p,degrees){\n    const v=sub(p,A),t=rad(degrees),c=Math.cos(t),s=Math.sin(t);\n    return add(A,add(add(mul(v,c),mul(cross(K,v),s)),mul(K,dot(K,v)*(1-c))));\n  }\n  const theta=angle=>angle+80;\n  const radial=(p,angle)=>rotate(p,theta(angle));\n  const ulna=y=>[23+5*Math.sin(y/308*Math.PI),y,-3];\n  const radius=y=>[-27-7*Math.sin(y/308*Math.PI),y,0];\n  function frame(angle,camera=0){\n    const surfaces=[],lines=[],anchors={};\n    const polygon=(points,color,kind='muscle',id='',opacity=1)=>surfaces.push({points,color,kind,id,opacity});\n    const line=(points,kind='fiber',id='')=>lines.push({points,kind,id});\n    function tube(sections,color,kind,id,transform=p=>p,n=18){\n      const rings=sections.map(([p,rx,rz])=>Array.from({length:n},(_,i)=>{\n        const t=i*2*Math.PI/n;return transform(add(p,[rx*Math.cos(t),0,rz*Math.sin(t)]));\n      }));\n      for(let j=0;j\u003crings.length-1;j++)for(let i=0;i\u003cn;i++){\n        polygon([rings[j][i],rings[j][(i+1)%n],rings[j+1][(i+1)%n],rings[j+1][i]],color,kind,id);\n      }\n      polygon(rings[0].slice().reverse(),color,kind,id);polygon(rings.at(-1),color,kind,id);\n    }\n    tube([[[0,-66,0],15,14],[[0,-30,0],18,16],[[0,-12,0],38,18],[[0,0,0],34,17]],'bone','bone','humerus');\n    tube([[ulna(-7),18,14],[ulna(12),16,13],[ulna(43),10,9],[ulna(125),7,7],[ulna(253),6,6],[ulna(308),10,9]],'bone','bone','ulna');\n    tube([[radius(0),13,10],[radius(15),9,8],[radius(50),9,8],[radius(135),8,7],[radius(245),10,9],[radius(308),23,14]],'bone','bone','radius',p=>radial(p,angle));\n    anchors.radius=radial(radius(223),angle);anchors.ulna=ulna(237);\n    anchors.head=A;anchors.wrist=B;\n    line([A,B],'axis');\n    // Palm and fingers form a rigid, neutral wrist block attached to the radius.\n    const hand=p=>radial(p,angle);\n    const base=[[-42,316,0],[23,316,0],[30,366,0],[-39,372,0]];\n    const front=base.map(p=>add(p,[0,0,11]));\n    const back=base.map(p=>add(p,[0,0,-10]));\n    tube([[[-10,302,0],32,14],[[-10,316,0],33,13],[[-10,325,0],33,12]],'hand','hand','wrist',hand,20);\n    polygon(front.map(hand),'hand','hand','palm');polygon(back.slice().reverse().map(hand),'hand','hand','back');\n    for(let i=0;i\u003c4;i++)polygon([front[i],back[i],back[(i+1)%4],front[(i+1)%4]].map(hand),'hand','hand','hand-edge');\n    const fingerXs=[-30,-12,6,22], lengths=[82,91,83,63];\n    fingerXs.forEach((x,i)=>{\n      tube([[[x,362,0], sparent',transparent.checked);\n    buttons.forEach(([b,v])=>b.setAttribute('aria-pressed',String(v===camera)));\n    const view=camera==='front'?'앞쪽에서 약간 비스듬하게':camera==='back'?'뒤쪽에서 약간 비스듬하게':'측면';\n    const action=drive>.04?'굽힘 · 햄스트링 단축 예시':drive\u003c-.04?'폄 · 대퇴사두근 단축 예시':'무릎 펴짐–굽힘';\n    caption.textContent=`${view} · 고관절 고정 · ${action}`;\n  }\n  function phaseFor(a,d){const p=Math.acos(Math.max(-1,Math.min(1,1-a/60)));return d\u003c0?2*Math.PI-p:p;}\n  function snapshot(){return {modelContent:{topic:'대퇴부 무릎 굽힘 도해',angle:Math.round(angle),drive,camera,fibers:fibers.checked,transparent:transparent.checked},privateContent:{playing}};}\n  function save(){const s=snapshot();try{localStorage.setItem(store,JSON.stringify(s));}catch{}if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState(s)).catch(()=>{});}\n  function restore(s){\n    const d=s?.modelContent;if(d?.topic!=='대퇴부 무릎 굽힘 도해')return;\n    if(Number.isFinite(d.angle))angle=Math.max(0,Math.min(120,d.angle));\n    if(Number.isFinite(d.drive))drive=Math.max(-1,Math.min(1,d.drive));\n    if(['front','side','back'].includes(d.camera))camera=d.camera;\n    if(typeof d.fibers==='boolean')fibers.checked=d.fibers;if(typeof d.transparent==='boolean')transparent.checked=d.transparent;\n    if(typeof s.privateContent?.playing==='boolean')playing=s.privateContent.playing&&!matchMedia('(prefers-reduced-motion: reduce)').matches;\n    phase=phaseFor(angle,drive);\n  }\n  function resize(){width=root.clientWidth;scale=width/560;const height=620*scale+16;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('height',height);drawing.setAttribute('transform',`scale(${scale})`);draw();}\n  play.addEventListener('click',()=>{interacted=true;playing=!playing;if(playing)phase=phaseFor(angle,drive);sync();save();});\n  slider.addEventListener('input',()=>{interacted=true;const next=Number(slider.value);drive=next>angle ? .75 : next\u003cangle ? -.75 : drive;angle=next;playing=false;phase=phaseFor(angle,drive);sync();draw();});slider.addEventListener('change',save);\n  [fibers,transparent].forEach(c=>c.addEventListener('change',()=>{interacted=true;sync();draw();save();}));\n  buttons.forEach(([b,v])=>b.addEventListener('click',()=>{interacted=true;camera=v;sync();draw();save();}));\n  window.addEventListener('openai:set_globals',e=>{if(!interacted){restore(e.detail?.globals?.widgetState);sync();draw();}});\n  try{restore(window.openai?.widgetState||JSON.parse(localStorage.getItem(store)||'null'));}catch{}\n  sync();new ResizeObserver(resize).observe(root);resize();root.dataset.geometryVerification=JSON.stringify(ThighModel.verify());\n  function tick(t){\n    const dt=last?Math.min((t-last)/1000,.08):0;last=t;\n    if(playing&&!document.hidden){phase+=dt*Math.PI/5;angle=60*(1-Math.cos(phase));drive=Math.sin(phase);if(t-lastDraw>=33){sync();draw();lastDraw=t;}}\n    if(root.isConnected)requestAnimationFrame(tick);\n  }\n  requestAnimationFrame(tick);\n})();\n\u003c/script>\n\u003cscript>\n(()=>{const r=document.getElementById('thigh-motion'),s=r.querySelector('svg');let p=false;function f(){p=false;const available=Math.max(0,document.documentElement.clientWidth-32),overhead=r.scrollHeight-s.getBoundingClientRect().height,heightWidth=(innerHeight-overhead-48)*560/620,w=Math.min(available,700,Math.max(220,heightWidth)),n=Math.floor(w)+'px';if(r.style.width!==n)r.style.width=n;}const q=()=>{if(!p){p=true;requestAnimationFrame(f);}};new ResizeObserver(q).observe(r);window.addEventListener('resize',q);q();})();\n\u003c/script>\u003c/body>\u003c/html>", "sourceFile": "work/thigh-motion.html"}}</script>
<script>
(() => {
  const topics=JSON.parse(document.getElementById('anatomy-data').textContent);
  const cards=[...document.querySelectorAll('.card')],frame=document.getElementById('anatomy-frame');
  const panel=document.getElementById('anatomy-panel'),name=document.getElementById('selected-name');
  const status=document.getElementById('selection-status'),list=document.querySelector('.cards');
  const keys=cards.map(c=>c.dataset.topic),storeKey='anatomy-hub-v1';
  let active=null,states={},saved;
  try{saved=JSON.parse(localStorage.getItem(storeKey)||'null');if(saved?.states&&typeof saved.states==='object')states=saved.states;}catch{}

  const aliases={chest:['upperbody','front','상체 팔 올리기'],back:['upperbody','back','상체 팔 올리기'],biceps:['arm','front','팔 팔꿈치 굽힘'],triceps:['arm','back','팔 팔꿈치 굽힘']};
  for(const old of [saved?.active,...Object.keys(aliases)]){
    if(!Object.hasOwn(aliases,old)||!states[old])continue;
    const [key,camera,topic]=aliases[old];if(states[key])continue;
    const state=states[old];states[key]={...state,modelContent:{...state.modelContent,topic,camera,drive:state.modelContent?.drive||1}};
  }
  const restoredActive=aliases[saved?.active]?.[0]||saved?.active;
  const persist=()=>{try{localStorage.setItem(storeKey,JSON.stringify({active,states}));}catch{}};
  function select(key){
    if(!Object.hasOwn(topics,key)||active===key)return;
    active=key;
    for(const card of cards){const selected=card.dataset.topic===key;card.setAttribute('aria-selected',String(selected));card.tabIndex=selected?0:-1;}
    const topic=topics[key];
    panel.setAttribute('aria-labelledby','tab-'+key);name.textContent=topic.label+' · '+topic.movement;
    frame.title=topic.label+' 애니메이션';status.textContent=topic.label+' 선택됨';
    const config=JSON.stringify({key,state:states[key]||null}).replaceAll('<','\\u003c');
    frame.srcdoc=topic.document.replace('__HUB_CONFIG__',config);
    persist();
  }
  cards.forEach((card,index)=>{
    card.addEventListener('click',()=>select(card.dataset.topic));
    card.addEventListener('keydown',event=>{
      if(event.altKey||event.ctrlKey||event.metaKey)return;
      let next;
      if(event.key==='ArrowDown'||event.key==='ArrowRight')next=(index+1)%cards.length;
      else if(event.key==='ArrowUp'||event.key==='ArrowLeft')next=(index+cards.length-1)%cards.length;
      else if(event.key==='Home')next=0;else if(event.key==='End')next=cards.length-1;else return;
      event.preventDefault();cards[next].focus();select(cards[next].dataset.topic);
    });
  });
  window.addEventListener('message',event=>{
    const data=event.data;
    if(event.source!==frame.contentWindow||data?.type!=='anatomy-hub-state'||!Object.hasOwn(topics,data.key))return;
    if(!data.state||typeof data.state!=='object')return;
    states[data.key]=data.state;persist();
  });
  const narrow=matchMedia('(max-width:680px)');
  const orientation=()=>list.setAttribute('aria-orientation',narrow.matches?'horizontal':'vertical');
  narrow.addEventListener('change',orientation);orientation();
  select(keys.includes(restoredActive)?restoredActive:'upperbody');
})();
</script>
