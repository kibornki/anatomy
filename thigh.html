:root[data-theme="light"] {

}

:root[data-theme="dark"] {

}

* {

}

html > body {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

}

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;

h2,
h3,
h4,
h5,
h6,

}

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {

code:not(pre code) {

  background: var(--muted);

  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;

}

.table-responsive {

  overflow-x: auto;
  scrollbar-width: thin;
}

.table {

  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {

}

.table thead th {
  padding-block: 8px;

}

.table tbody tr:last-child :is(th, td) {

}

}

}

}

}

.table .text-nowrap {

}

#widget {

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;

}

.card {

  corner-shape: var(--corner-shape);

}

  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

}

.tooltip {

    20rem,

    var(--tooltip-available-height, calc(100vh - 10px)),

  );

.viz-badge {

.text-muted {

}

.tabular-nums {

}

.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {

}

.btn,

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {

/* Local surface visibility from the actual projected tube mesh. A single

const ThighRenderer = (() => {
  const STEP=1.7,X0=-280,Y0=-40,NX=224,NY=350;
  const key=(x,y)=>y*(NX+1)+x;
  const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
  function simplify(points,tolerance=.65){
    if(points.length<5)return points;
    const keep=new Set([0,points.length-1]);
    function visit(lo,hi){
      const a=points[lo],b=points[hi],vx=b[0]-a[0],vy=b[1]-a[1],length=vx*vx+vy*vy;
      let far=-1,max=tolerance*tolerance;
      for(let i=lo+1;i<hi;i++){
        const p=points[i],t=length?clamp(((p[0]-a[0])*vx+(p[1]-a[1])*vy)/length,0,1):0;
        const d=(p[0]-a[0]-t*vx)**2+(p[1]-a[1]-t*vy)**2;
        if(d>max){max=d;far=i;}
      }
      if(far>=0){keep.add(far);visit(lo,far);visit(far,hi);}
    }
    visit(0,points.length-1);return points.filter((_,i)=>keep.has(i));
  }
  function contours(owns,bounds){
    const edges=new Map();
    const add=(x1,y1,x2,y2)=>{const k=key(x1,y1);if(!edges.has(k))edges.set(k,[]);edges.get(k).push(key(x2,y2));};
    for(let y=bounds.y0;y<=bounds.y1;y++)for(let x=bounds.x0;x<=bounds.x1;x++){
      if(!owns(x,y))continue;
      if(!owns(x,y-1))add(x,y,x+1,y);
      if(!owns(x+1,y))add(x+1,y,x+1,y+1);
      if(!owns(x,y+1))add(x+1,y+1,x,y+1);
      if(!owns(x-1,y))add(x,y+1,x,y);
    }
    const loops=[];
    while(edges.size){
      const start=edges.keys().next().value;let p=start;const points=[];
      do{
        points.push([X0+(p%(NX+1))*STEP,Y0+Math.floor(p/(NX+1))*STEP,0]);
        const next=edges.get(p);if(!next)break;
        const q=next.pop();if(!next.length)edges.delete(p);p=q;
      }while(p!==start&&points.length<30000);
      if(points.length>4){
        // Smooth the grid boundary before reducing vertices, preserving the
        // established curved outlines instead of exposing raster stair steps.
        const weights=[1,2,3,4,3,2,1],smooth=points.map((_,i)=>[0,1,2].map(axis=>weights.reduce((sum,w,j)=>sum+w*points[(i+j-3+points.length)%points.length][axis],0)/16));
        const mid=Math.floor(smooth.length/2);
        loops.push(simplify(smooth.slice(0,mid+1)).concat(simplify(smooth.slice(mid).concat([smooth[0]])).slice(1,-1)));
      }
    }

  }
  function patch(loops){
    return loops.map(points=>{
      let twiceArea=0,x=0,y=0;
      points.forEach((p,i)=>{const q=points[(i+1)%points.length],c=p[0]*q[1]-q[0]*p[1];twiceArea+=c;x+=(p[0]+q[0])*c;y+=(p[1]+q[1])*c;});
      return {area:Math.abs(twiceArea)/2,anchor:Math.abs(twiceArea)>1e-8?[x/(3*twiceArea),y/(3*twiceArea),0]:points[0]};
    }).sort((a,b)=>b.area-a.area)[0]||{area:0,anchor:[0,0,0]};
  }
  function render(model,camera,transparent){
    const view=p=>ThighModel.view(p,camera);
    const raw=model.bones.map(x=>({...x,kind:'bone'})).concat(model.muscles,model.tendons.map(x=>({...x,kind:'tendon'})),[{id:'foot',kind:'bone',rows:model.foot}]);
    const items=raw.map(x=>({...x,rows:x.rows.map(s=>({...s,center:view(s.center),ring:s.ring.map(view)}))}));
    const depth=new Float32Array(NX*NY).fill(-Infinity),owner=new Int16Array(NX*NY).fill(-1);

        triangle(a,b,c,id,item);triangle(a,c,d,id,item);
      }
      for(const row of [rows[0],rows.at(-1)])for(let j=0;j<n;j++)triangle(row.center,row.ring[j],row.ring[(j+1)%n],id,item);
      item.depth=rows.reduce((s,r)=>s+r.center[2],0)/rows.length;
    });

      const owns=(x,y)=>x>=0&&x<NX&&y>=0&&y<NY&&owner[y*NX+x]===id;
      item.visible=contours(owns,item.bounds);

        const b=item.bounds;

      }else item.loops=item.visible;

      // Place its leader inside the actual visible region, with edge clearance.
      if(!transparent&&item.area){
        let best=null,distance=Infinity;
        for(let y=item.bounds.y0+2;y<=item.bounds.y1-2;y++)for(let x=item.bounds.x0+2;x<=item.bounds.x1-2;x++){
          if(!owns(x,y)||!owns(x-2,y)||!owns(x+2,y)||!owns(x,y-2)||!owns(x,y+2))continue;
          const p=[X0+(x+.5)*STEP,Y0+(y+.5)*STEP,0],d=(p[0]-item.anchor[0])**2+(p[1]-item.anchor[1])**2;
          if(d<distance){best=p;distance=d;}
        }
        if(best)item.anchor=best;
      }
      delete item.mask;
    });
    return items;
  }
  function fiber(rows,u){
    return rows.map(row=>{
      const p=row.ring,xs=p.map(v=>v[0]),x=Math.min(...xs)+(Math.max(...xs)-Math.min(...xs))*u;
      let best=null;
      for(let j=0;j<p.length;j++){
        const a=p[j],b=p[(j+1)%p.length],dx=b[0]-a[0];
        if(Math.abs(dx)<1e-8||x<Math.min(a[0],b[0])||x>Math.max(a[0],b[0]))continue;

      }
      return best||p.reduce((a,b)=>a[2]>b[2]?a:b);
    });
  }
  return {render,fiber};
})();

(() => {
  const root=document.getElementById('thigh-motion'),svg=root.querySelector('svg');

  const f=n=>Math.round(n*100)/100,P=p=>[280+p[0],45+p[1]],xy=p=>`${f(p[0])},${f(p[1])}`;

      muscle('vastus-lateralis','외측광근',.14,222);muscle('vastus-medialis','내측광근',.87,284);

    const rounded=Math.round(angle),text=rounded===0?'펴짐 0°':`굽힘 ${rounded}°`;

    root.dataset.angle=String(f(angle));root.dataset.camera=camera;root.dataset.drive=String(f(drive));root.dataset.revision='oblique-reference-thigh-v4';root.dataset.cameraYaw=String(camera==='side'?90:32);
