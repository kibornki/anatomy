:root[data-theme="light"] {

}

:root[data-theme="dark"] {

}

* {

}

html > body {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

}

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;

h2,
h3,
h4,
h5,
h6,

}

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {

code:not(pre code) {

  background: var(--muted);

  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;

}

.table-responsive {

  overflow-x: auto;
  scrollbar-width: thin;
}

.table {

  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {

}

.table thead th {
  padding-block: 8px;

}

.table tbody tr:last-child :is(th, td) {

}

}

}

}

}

.table .text-nowrap {

}

#widget {

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;

}

.card {

  corner-shape: var(--corner-shape);

}

  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

}

.tooltip {

    20rem,

    var(--tooltip-available-height, calc(100vh - 10px)),

  );

.viz-badge {

.text-muted {

}

.tabular-nums {

}

.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {

}

.btn,

    const patella=byId.get('patella');
    if(patella?.area>15||transparent.checked)leader('patella','무릎뼈',.87,352,ThighModel.view(m.patella,camera));
    if(camera==='side'||transparent.checked){const calf=[byId.get('gastrocnemius-medial'),byId.get('gastrocnemius-lateral')].sort((a,b)=>b.area-a.area)[0];if(calf?.area>45)leader('calf','장딴지근',.14,437,calf.anchor);}
    const rounded=Math.round(angle),text=rounded===0?'펴짐 0°':`굽힘 ${rounded}°`;
    value.textContent=text;slider.value=rounded;slider.setAttribute('aria-valuetext',text);
    root.dataset.angle=String(f(angle));root.dataset.camera=camera;root.dataset.drive=String(f(drive));root.dataset.revision='functional-thigh-v2';
    root.dataset.knee=ThighModel.view(m.knee,camera).map(f).join(',');
  }
  function sync(){
    play.textContent=playing?'일시정지':'재생';play.setAttribute('aria-pressed',String(playing));
    root.classList.toggle('no-fibers',!fibers.checked);root.classList.toggle('transparent',transparent.checked);
    buttons.forEach(([b,v])=>b.setAttribute('aria-pressed',String(v===camera)));
    const view=camera==='front'?'정면':camera==='back'?'후면':'측면';
    const action=drive>.04?'굽힘 · 햄스트링 수축':drive<-.04?'폄 · 대퇴사두근 수축':'무릎 펴짐–굽힘';
    caption.textContent=`${view} · 고관절 고정 · ${action}`;
  }
  function phaseFor(a,d){const p=Math.acos(Math.max(-1,Math.min(1,1-a/60)));return d<0?2*Math.PI-p:p;}
  function snapshot(){return {modelContent:{topic:'대퇴부 무릎 굽힘 도해',angle:Math.round(angle),drive,camera,fibers:fibers.checked,transparent:transparent.checked},privateContent:{playing}};}
  function save(){const s=snapshot();try{localStorage.setItem(store,JSON.stringify(s));}catch{}if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState(s)).catch(()=>{});}
  function restore(s){
    const d=s?.modelContent;if(d?.topic!=='대퇴부 무릎 굽힘 도해')return;
    if(Number.isFinite(d.angle))angle=Math.max(0,Math.min(120,d.angle));
    if(Number.isFinite(d.drive))drive=Math.max(-1,Math.min(1,d.drive));
    if(['front','side','back'].includes(d.camera))camera=d.camera;
    if(typeof d.fibers==='boolean')fibers.checked=d.fibers;if(typeof d.transparent==='boolean')transparent.checked=d.transparent;
    if(typeof s.privateContent?.playing==='boolean')playing=s.privateContent.playing&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
    phase=phaseFor(angle,drive);
  }
  function resize(){width=root.clientWidth;scale=width/560;const height=620*scale+16;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('height',height);drawing.setAttribute('transform',`scale(${scale})`);draw();}
  play.addEventListener('click',()=>{interacted=true;playing=!playing;if(playing)phase=phaseFor(angle,drive);sync();save();});
  slider.addEventListener('input',()=>{interacted=true;const next=Number(slider.value);drive=next>angle ? .75 : next<angle ? -.75 : drive;angle=next;playing=false;phase=phaseFor(angle,drive);sync();draw();});slider.addEventListener('change',save);
  [fibers,transparent].forEach(c=>c.addEventListener('change',()=>{interacted=true;sync();draw();save();}));
  buttons.forEach(([b,v])=>b.addEventListener('click',()=>{interacted=true;camera=v;sync();draw();save();}));
  window.addEventListener('openai:set_globals',e=>{if(!interacted){restore(e.detail?.globals?.widgetState);sync();draw();}});
  try{restore(window.openai?.widgetState||JSON.parse(localStorage.getItem(store)||'null'));}catch{}
  sync();new ResizeObserver(resize).observe(root);resize();root.dataset.geometryVerification=JSON.stringify(ThighModel.verify());
  function tick(t){
    const dt=last?Math.min((t-last)/1000,.08):0;last=t;
    if(playing&&!document.hidden){phase+=dt*Math.PI/5;angle=60*(1-Math.cos(phase));drive=Math.sin(phase);if(t-lastDraw>=33){sync();draw();lastDraw=t;}}
    if(root.isConnected)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
<script>
(()=>{const r=document.getElementById('thigh-motion'),s=r.querySelector('svg');let p=false;function f(){p=false;const available=Math.max(0,document.documentElement.clientWidth-32),overhead=r.scrollHeight-s.getBoundingClientRect().height,heightWidth=(innerHeight-overhead-48)*560/620,w=Math.min(available,700,Math.max(220,heightWidth)),n=Math.floor(w)+'px';if(r.style.width!==n)r.style.width=n;}const q=()=>{if(!p){p=true;requestAnimationFrame(f);}};new ResizeObserver(q).observe(r);window.addEventListener('resize',q);q();})();
