<style>
.body-fit{border-top:1px solid var(--border);margin-top:18px;padding-top:14px;text-align:left}.body-fit summary{cursor:pointer;font-weight:600}.body-fit p{margin:10px 0;color:var(--muted-foreground);font-size:12px}.body-fit-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}.body-fit .form-label{display:flex;justify-content:space-between;gap:8px}.body-fit-photo{position:relative;max-width:420px;margin:12px auto;background:var(--card)}.body-fit-photo img{display:block;width:100%;max-height:440px;object-fit:contain}.body-fit-photo svg{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:crosshair}.body-fit-photo circle{fill:var(--primary);stroke:white;stroke-width:2}.body-fit-photo text{fill:white;font:bold 16px system-ui;paint-order:stroke;stroke:#174e7c;stroke-width:3}.body-fit-actions{display:flex;flex-wrap:wrap;gap:8px}.body-fit input[type=file]{width:100%;font-size:12px}.body-fit select{background:var(--background);color:var(--foreground);border:1px solid var(--border);padding:8px;border-radius:var(--radius)}.body-fit-status{min-height:1.5em}.body-fit [hidden]{display:none!important}.body-fit .btn{font-size:12px}.body-fit-photo-wrap{min-width:0}
</style>
<details class="body-fit" id="upperbody-body-fit"><summary>상체 체형 맞추기 · 시험</summary>
<p>너비·깊이·몸통 길이를 기준 체형의 95–105%로 조절합니다. 사진의 비율을 참고해 맞추는 첫 버전입니다.</p>
<div class="body-fit-grid">
<div><label class="form-label" for="upperbody-shape-width">상체 너비 <output id="upperbody-shape-width-value">100%</output></label><input class="form-range" id="upperbody-shape-width" type="range" min="95" max="105" step="1" value="100"></div>
<div><label class="form-label" for="upperbody-shape-depth">흉곽 깊이 <output id="upperbody-shape-depth-value">100%</output></label><input class="form-range" id="upperbody-shape-depth" type="range" min="95" max="105" step="1" value="100"></div>
<div><label class="form-label" for="upperbody-shape-length">몸통 길이 <output id="upperbody-shape-length-value">100%</output></label><input class="form-range" id="upperbody-shape-length" type="range" min="95" max="105" step="1" value="100"></div>
</div><div class="body-fit-actions"><button class="btn" type="button" id="upperbody-shape-reset">기준 체형으로</button></div>
<p>사진으로 비율 맞추기: 팔을 내린 정면 또는 측면 사진을 선택하고 기준점 4개를 찍으세요. 실제 근육량이나 내부 구조를 추정하지는 않습니다.</p>
<div class="body-fit-actions"><label for="upperbody-photo-view">사진 방향</label><select id="upperbody-photo-view"><option value="front">정면 · 너비</option><option value="side">측면 · 깊이</option></select></div>
<label class="form-label" for="upperbody-photo">참고 사진 선택</label><input id="upperbody-photo" type="file" accept="image/jpeg,image/png,image/webp">
<p class="body-fit-status" id="upperbody-photo-status" role="status" aria-live="polite">사진은 이 브라우저에서만 읽으며 서버로 보내지 않습니다.</p>
<div class="body-fit-photo-wrap" id="upperbody-photo-wrap" hidden><div class="body-fit-photo"><img id="upperbody-photo-image" alt="체형 비율을 맞출 참고 사진"><svg id="upperbody-photo-marks" aria-label="사진 기준점 선택"></svg></div>
<div class="body-fit-actions"><button class="btn" type="button" id="upperbody-photo-undo">마지막 점 취소</button><button class="btn btn-primary" type="button" id="upperbody-photo-apply" disabled>비율 적용</button><button class="btn" type="button" id="upperbody-photo-clear">사진 지우기</button></div></div>
<p>정면은 흉곽의 좌우 폭, 측면은 흉곽의 앞뒤 폭을 표시하세요. 옷·지방·원근을 포함한 겉비율이므로 적용 후 직접 보정하세요. 몸통 길이를 바꾼 뒤에는 사진 비율을 다시 적용할 수 있습니다.</p>
</details>
